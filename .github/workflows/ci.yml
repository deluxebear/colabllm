name: CLI tests and distributions

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.8'
      - name: Prepare Python
        shell: bash
        run: |
          uv python install '${{ matrix.python }}'
          uv venv --python '${{ matrix.python }}'
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install completion shells
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes zsh fish
          else
            brew install fish
          fi
      - name: Run local tests without model dependencies
        run: python -m unittest discover -s tests
      - name: Build wheel and source distribution
        run: uv build --no-sources --quiet
      - name: Verify isolated tool installation
        shell: bash
        run: |
          for wheel in dist/*.whl; do
            python tools/check_distribution.py "$wheel"
          done
